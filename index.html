<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cat Petting Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Krona+One&family=Shantell+Sans:wght@300..800&display=swap">
<style>
/* Layout: a printed form filled in by hand. One step at a time; the zones step pairs a sticky heat map with a control column. */
:root{
  --paper:#EBEEF3; --card:#FFFFFF; --ink:#1B2030; --muted:#586074; --line:#D2D7E1; --soft:#E3E7EE; --wash:#F5F7FA;
  --cat-base:#E1E5EC; --cat-hatch:#C2C9D5; --cat-face:#1B2030; --dim:rgba(255,255,255,.58); --focus:#2F5FDB;
  --fav:#2F6FD6; --always:#25A464; --brief:#E8BC2E; --mood:#EF7B2A; --danger:#D6303F;
  --f-display:"Krona One","Arial Black",system-ui,sans-serif;
  --f-hand:"Shantell Sans","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10121A; --card:#1A1D28; --ink:#E8EBF2; --muted:#9BA2B5; --line:#2E3344; --soft:#262A38; --wash:#151822;
    --cat-base:#5A6176; --cat-hatch:#6C7489; --cat-face:#12141B; --dim:rgba(26,29,40,.5); --focus:#86A6FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10121A; --card:#1A1D28; --ink:#E8EBF2; --muted:#9BA2B5; --line:#2E3344; --soft:#262A38; --wash:#151822;
  --cat-base:#5A6176; --cat-hatch:#6C7489; --cat-face:#12141B; --dim:rgba(26,29,40,.5); --focus:#86A6FF; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;font-family:var(--f-display);font-size:12px;letter-spacing:.02em;white-space:nowrap}
.brand svg{flex:none}
.stepper{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.st{display:flex;align-items:center;gap:7px;border:0;background:none;padding:7px 10px;border-radius:999px;color:var(--muted);font-size:14px;white-space:nowrap}
.st .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid currentColor;font-variant-numeric:tabular-nums}
.st[aria-current="step"]{background:var(--ink);color:var(--card)}
.st[aria-current="step"] .n{border-color:var(--card)}
.st.done .n{background:var(--soft);border-color:var(--soft);color:var(--ink)}
@media (hover:hover){ .st:hover:not([aria-current="step"]){background:var(--soft);color:var(--ink)} }
.st .cnt{font-variant-numeric:tabular-nums;opacity:.75;font-size:12px}
@media (max-width:760px){ .st .lbl{display:none} .st[aria-current="step"] .lbl{display:inline} .topbar.steps .brand span{display:none} }

main{max-width:1120px;margin:0 auto;padding-block:28px 120px}
.view[hidden]{display:none}
.eyebrow{font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
h1{font-size:clamp(26px,4.2vw,36px);line-height:1.12;margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.lede{color:var(--muted);max-width:60ch;margin:0;font-size:17px}
.step-head{margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.form{padding:22px;display:grid;gap:22px;max-width:680px}
.lab{display:block;font-family:var(--f-display);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lab i{font-family:var(--f-body);font-style:normal;text-transform:none;letter-spacing:0;font-size:13px;opacity:.85;margin-left:4px}
.help{color:var(--muted);font-size:14px;margin:8px 0 0}
.hand{font-family:var(--f-hand)}
input.txt,textarea.txt{width:100%;background:var(--wash);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:18px;line-height:1.35}
input.txt:focus,textarea.txt:focus{border-color:var(--ink);outline:none;background:var(--card)}
input.big{font-size:28px;font-weight:700;padding:10px 14px}
textarea.txt{resize:vertical;min-height:84px}
::placeholder{color:var(--muted);opacity:.65}

.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 15px;font-size:15px;line-height:1.25;text-align:left}
.seg button:hover,.chip:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-hand);font-size:15px;display:inline-flex;align-items:center;gap:8px}
.chip .x{opacity:.7;font-family:var(--f-body);font-size:13px}
.chip.custom{border-style:dashed}
.chip.more{font-family:var(--f-body);font-size:14px;color:var(--muted);border-style:dashed}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;font-size:16px;padding:9px 12px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.ghost{border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 12px;font-size:14px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.linkbtn:hover{color:var(--ink)}

/* photo */
.photo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--soft);display:grid;place-items:center;overflow:hidden;border:1.5px solid var(--line);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--wash);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;max-width:680px;font-size:15px}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);grid-template-areas:"copy sheet" "how sheet";column-gap:48px;align-items:center;padding-top:12px}
.home-copy{grid-area:copy;align-self:end}
.home-sheet{grid-area:sheet}
.how{grid-area:how;align-self:start}
.home h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,62px);line-height:1.05;letter-spacing:-.02em;margin-bottom:18px}
.home h1 em{font-style:normal;color:var(--danger)}
.home .lede{font-size:18px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 8px}
.notme{margin:2px 0 0;font-size:15px;color:var(--muted)}
.notme .linkbtn{font-size:15px}
.cta .btn{padding:13px 20px;font-size:16px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border:1.5px solid var(--danger);border-radius:12px;font-size:15px}
.how{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px;counter-reset:h}
.how li{display:flex;gap:12px;align-items:baseline;color:var(--muted);counter-increment:h}
.how li::before{content:counter(h);font-family:var(--f-display);font-size:11px;color:var(--ink);width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transform:translateY(4px)}
.home-sheet{margin:0;justify-self:center;width:100%;max-width:440px}
.paper{background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(15,20,35,.12),0 12px 32px -8px rgba(15,20,35,.28);overflow:hidden;line-height:0}
.paper img{width:100%;height:auto;display:block}
.home-sheet .paper{transform:rotate(1.4deg)}
figcaption{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
@media (max-width:820px){ .home{grid-template-columns:minmax(0,1fr);grid-template-areas:"copy" "sheet" "how";row-gap:28px} .home-sheet{max-width:340px} .how{margin-top:8px} }

/* zones */
.zones-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
.zones-grid > *{min-width:0}
.map-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px)}
.map-card{padding:14px 14px 12px}
.map-wrap{display:flex;justify-content:center;position:relative}
.lookbar{display:grid;gap:6px;max-width:620px;margin:0 auto 14px}
.lookrow{display:flex;align-items:center;gap:8px;min-width:0}
.lookrow .lab{margin:0;width:46px;flex:none}
.strip{position:relative;display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.strip::-webkit-scrollbar{display:none}
.look{flex:none;width:76px;display:grid;gap:1px;justify-items:center;align-content:start;border:1.5px solid transparent;background:none;border-radius:10px;padding:3px 2px 4px;font-size:11.5px;line-height:1.15;color:var(--muted);text-align:center}
.look img{width:64px;height:auto;display:block}
.look:hover{background:var(--wash);color:var(--ink)}
.look[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700;background:var(--card)}
.strip .look:last-child{margin-right:24px}
#map{display:block;touch-action:manipulation;cursor:pointer;max-width:100%}
.mini-legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:10px;font-size:13px;color:var(--muted)}
.mini-legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;background:var(--c);display:inline-block}
.sw.unset{background:repeating-linear-gradient(45deg,var(--cat-base) 0 3px,var(--cat-hatch) 3px 4.5px)}
.map-help{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 0}
.zstrip{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:12px 2px 2px;margin-top:10px;border-top:1px dashed var(--line)}
.zchip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px 5px 8px;font-size:13.5px;white-space:nowrap}
.zchip[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c,transparent);border:1.5px solid var(--c,var(--muted));flex:none}
.zcard{padding:20px}
.zhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.count{font-size:13px;color:var(--muted);margin:0 0 2px;font-variant-numeric:tabular-nums}
.zhead h2{font-size:28px}
.hint{color:var(--muted);font-size:14.5px;margin:6px 0 16px}
.levels{display:grid;gap:8px}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;position:relative}
.lv:hover{border-color:var(--c)}
.lv[aria-checked="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));box-shadow:inset 0 0 0 1px var(--c)}
.badge{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none}
.badge svg{width:20px;height:20px}
.lt{display:grid;flex:1;min-width:0}
.lt b{font-size:16px}
.lt small{color:var(--muted);font-size:13.5px}
.typ{justify-self:start;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}
.lv .ck{width:22px;height:22px;flex:none;opacity:0}
.lv[aria-checked="true"] .ck{opacity:1}
.skip{margin-top:8px}
.tips{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.tips .lab{margin-bottom:10px}
.locked{color:var(--muted);font-size:14.5px;margin:0}
.znav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.quick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:14.5px;color:var(--muted)}
@media (max-width:860px){
  .zones-grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .map-col{top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;background:var(--paper);padding-top:8px;margin-top:-8px}
  .map-card{padding:8px 8px 6px;border-radius:14px;box-shadow:0 8px 18px -12px rgba(10,14,25,.5)}
  .map-help,.mini-legend{display:none}
  .zstrip{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin-top:6px;padding:8px 2px 2px}
  .zstrip::-webkit-scrollbar{display:none}
  .zhead h2{font-size:24px}
  .zcard{padding:16px}
}

/* generic step cards */
.stack{display:grid;gap:18px;max-width:760px}
.sec{padding:22px;display:grid;gap:22px}
.sec h3{margin:0;font-size:18px;display:flex;align-items:center;gap:10px}
.sec h3 .dot{width:12px;height:12px}
.sub{color:var(--muted);font-size:14.5px;margin:-14px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){ .two{grid-template-columns:1fr} }

/* print */
.print-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:start}
.print-grid > *{min-width:0}
.preview .paper{max-width:620px;margin:0 auto}
.actions{display:grid;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.actions .btn{width:100%;padding:13px 16px;font-size:16px}
.status{font-size:14.5px;min-height:1.4em;margin:0;color:var(--muted)}
.status.ok{color:var(--always)}
.status.err{color:var(--danger)}
.pts{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px;display:grid;gap:6px}
.fallback{font-size:14.5px;background:var(--wash);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:0}
@media (max-width:860px){ .print-grid{grid-template-columns:minmax(0,1fr)} .actions{position:static} }

/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottombar-in{max-width:1120px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px}
.bottombar .btn{min-width:110px}
.bottombar[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14.5px;z-index:20;max-width:calc(100% - 32px)}
#printwrap{display:none}
@media print{
  body > *:not(#printwrap){display:none!important}
  body::before{display:none!important}
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  #printwrap{display:block!important}
  #printwrap img{display:block;width:100%;height:auto;max-width:none}
}
@media (prefers-reduced-motion:no-preference){ .lv,.chip,.seg button,.zchip{transition:background-color .15s,border-color .15s,box-shadow .15s} }
</style>

<header class="topbar">
  <div class="topbar-in gut">
    <button class="brand" data-act="home" aria-label="Petting guide home">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M5 22V9.5L3.6 3.2l5.2 3.4a11 11 0 0 1 8.4 0l5.2-3.4L21 9.5V22z" fill="var(--danger)"/><path d="M5 22V13h16v9z" fill="var(--brief)"/><path d="M5 22v-4h16v4z" fill="var(--fav)"/><path d="M9.6 13.6q1.2-1.1 2.4 0M14 13.6q1.2-1.1 2.4 0" stroke="var(--ink)" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      <span>Petting Guide</span>
    </button>
    <nav class="stepper" id="stepper" aria-label="Steps"></nav>
  </div>
</header>

<main class="gut">
  <section class="view home" id="v-home"></section>
  <section class="view" id="v-about" hidden></section>
  <section class="view" id="v-zones" hidden>
    <div class="step-head" id="zones-head"></div>
    <div class="zones-grid">
      <div class="map-col">
        <div class="card map-card">
          <div class="map-wrap" id="mapwrap"><canvas id="map" role="img" aria-label="Cat body map"></canvas></div>
          <div class="mini-legend" id="minilegend"></div>
          <div class="zstrip" id="zstrip" role="list" aria-label="Body parts"></div>
          <p class="map-help">Tap any part of the cat to jump to it.</p>
        </div>
      </div>
      <div id="zonectl"></div>
    </div>
  </section>
  <section class="view" id="v-mood" hidden></section>
  <section class="view" id="v-notes" hidden></section>
  <section class="view" id="v-print" hidden></section>
</main>

<div id="printwrap" aria-hidden="true"><img id="printimg" alt=""></div>
<style id="pagesize">@page{size:letter;margin:0}</style>
<nav class="bottombar" id="bottombar" hidden>
  <div class="bottombar-in gut">
    <button class="btn ghost" id="bb-back" data-act="back">Back</button>
    <button class="btn primary" id="bb-next" data-act="next">Next</button>
  </div>
</nav>

<script>
"use strict";
/* ---------------- data ---------------- */
const LEVELS = [
  { id:'fav',    label:'Favorite spot',   desc:'Start here. Pure bliss.',      v:0,    color:'#2F6FD6', text:'#1E4E9E', glyph:'#ffffff' },
  { id:'always', label:'Nice',            desc:'Welcome any time.',            v:0.25, color:'#25A464', text:'#16704A', glyph:'#ffffff' },
  { id:'lovemood', label:'Will love when in the mood',     desc:'A hit when the mood is right.',   v:0.25, color:'#25A464', accent:'#EF7B2A', pattern:'dots', text:'#16704A', glyph:'#ffffff' },
  { id:'tolerate', label:'Will tolerate when in the mood', desc:'Puts up with it. Keep it short.', v:0.75, color:'#EF7B2A', accent:'#C4202F', pattern:'plus', text:'#9C4510', glyph:'#ffffff' },
  { id:'danger', label:'Danger zone',     desc:'Hands off.',                   v:1,    color:'#D6303F', text:'#A11E2B', glyph:'#ffffff' },
];
const LV = Object.fromEntries(LEVELS.map(l => [l.id, l]));
const OLD_LEVELS = { brief:'tolerate', mood:'lovemood' };
const TILE = {
  dots: c => `<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8'><circle cx='2' cy='2' r='1.25' fill='${c}'/><circle cx='6' cy='6' r='1.25' fill='${c}'/></svg>`,
  plus: c => `<svg xmlns='http://www.w3.org/2000/svg' width='8' height='8'><path d='M4 1.7v4.6M1.7 4h4.6' stroke='${c}' stroke-width='1.3' stroke-linecap='round'/></svg>`,
};
const swatchBg = l => l.pattern ? `url('data:image/svg+xml,${encodeURIComponent(TILE[l.pattern](l.accent)).replace(/'/g, '%27')}') 0 0/8px 8px, ${l.color}` : l.color;
/* accent marks (dots or plus signs) on a staggered grid, drawn in the current transform */
function drawMarks(ctx, kind, color, x0, y0, x1, y1, gap){

async function makePdf(canvas, ptW, ptH){
  const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.93));
  const jpg = new Uint8Array(await blob.arrayBuffer()), enc = new TextEncoder(), chunks = [], offs = []; let len = 0;
  const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; };
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n${body}\nendobj\n`); };
  push('%PDF-1.4\n'); push(new Uint8Array([37, 226, 227, 207, 211, 10]));
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${ptW} ${ptH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4] = len; push(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${canvas.width} /Height ${canvas.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); push(jpg); push('\nendstream\nendobj\n');
  const content = `q ${ptW} 0 0 ${ptH} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const xref = len; let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type:'application/pdf' });
}

    <div class="step-head"><p class="eyebrow">Step 4 of 5</p><h1>Anything else people should know?</h1><p class="lede">Warnings get a red box at the bottom of the page. Notes go right under it.</p></div>
    <div class="stack">
      <div class="card sec">
        <h3><span class="dot" style="--c:var(--danger)"></span>Warnings</h3><p class="sub">Pick any that apply, or write your own.</p>
        <div>${chipSet('warn', WARN, s.warn, s.warnCustom)}${addRow('warn', 'Add a warning, like a medical condition')}</div>
      </div>
      <div class="card sec">
        <label><span class="lab">Extra notes <i>optional</i></span><textarea class="txt hand" rows="4" data-bind="notes" data-fk="notes" maxlength="600" placeholder="Shy for the first ten minutes. Sit on the floor and let ${P().them} come to you.">${esc(s.notes)}</textarea></label>
        <div class="two">
          <label><span class="lab">Questions? Ask <i>optional</i></span><input class="txt hand" data-bind="contactName" data-fk="contactName" value="${esc(s.contactName)}" placeholder="Sam" maxlength="40" autocomplete="off"></label>
          <label><span class="lab">Phone <i>optional</i></span><input class="txt hand" data-bind="contactPhone" data-fk="contactPhone" value="${esc(s.contactPhone)}" placeholder="(555) 014-2290" maxlength="40" inputmode="tel" autocomplete="off"></label>
        </div>
      </div>
    </div>`;
}
let previewToken = 0;
function renderPrint(){
  const s = S, n = catName(), nSet = ZONE_ORDER.filter(k => s.zones[k] && s.zones[k].level).length, nLeft = ZONE_ORDER.length - nSet;
  $('#v-print').innerHTML = `
    <div class="step-head"><p class="eyebrow">Step 5 of 5</p><h1>${esc(n === 'your cat' ? 'Your' : possessive(n))} guide is ready to print</h1><p class="lede">${s.format === 'cards' ? 'Six wallet-size cards on one sheet. Print, then cut them out.' : 'Check it over, then save it. It fits on one page.'}</p></div>
    <div class="print-grid">
      <div class="preview"><div class="lookbar" id="lookbar"></div><div class="paper"><img id="sheetimg" alt="Printable petting guide preview" width="935" height="1210"></div></div>
      <div class="actions">
        ${nLeft ? `<p class="fallback">${nLeft} part${nLeft === 1 ? '' : 's'} of the body ${nLeft === 1 ? 'is' : 'are'} still unrated and show${nLeft === 1 ? 's' : ''} as grey stripes. <button class="linkbtn" data-act="go" data-v="zones">Rate ${nLeft === 1 ? 'it' : 'them'}</button></p>` : ''}
        <div><span class="lab">Format</span>${seg('format', { page:'Full page', cards:'Pocket cards' }, s.format || 'page')}</div>
        <div><span class="lab">Paper size</span>${seg('paper', { letter:'US Letter', a4:'A4' }, s.paper)}</div>
        <div id="saveactions"></div>
        <ul class="pts"><li>Open the PDF and print at 100% or "Actual size".</li><li>${s.format === 'cards' ? 'Cut along the dashed lines and hand one to each sitter or guest.' : 'Stick it on the fridge or next to the food bowl for sitters and guests.'}</li><li>Your answers stay in this browser, so you can come back and edit.</li></ul>
      </div>
    </div>`;
  renderPrintActions(); renderLookbar(); updatePreview();
}
function renderPrintActions(){
  const el = $('#saveactions'); if (!el) return;
  if (!downloadsChecked){ el.innerHTML = `<button class="btn primary" disabled>Save PDF</button><p class="status" id="savestatus">Getting ready…</p>`; return; }
  if (standalone){ el.innerHTML = `<div style="display:grid;gap:10px"><button class="btn primary" data-act="print">Print</button><button class="btn ghost" data-act="savepdf">Download PDF</button><button class="btn ghost" data-act="savepng">Download image</button></div><p class="status" id="savestatus" role="status"></p>`; }
  else if (downloads){ el.innerHTML = `<div style="display:grid;gap:10px"><button class="btn primary" data-act="savepdf">Save PDF</button><button class="btn ghost" data-act="savepng">Save as image</button></div><p class="status" id="savestatus" role="status"></p>`; }
  else { el.innerHTML = `<p class="fallback">Saving files isn't available in this view. Press and hold the preview (or right-click it) and choose Save Image, then print that image.</p>`; }
}
function updatePreview(){
  const tok = ++previewToken;
  renderOutput(S, 110, S.paper).then(cv => { if (tok !== previewToken) return; const im = $('#sheetimg'); if (im){ im.width = cv.width; im.height = cv.height; im.src = cv.toDataURL('image/png'); } });
}
function setStatus(msg, cls){ const el = $('#savestatus'); if (el){ el.textContent = msg; el.className = 'status' + (cls ? ' ' + cls : ''); } }
async function doPrint(){
  setStatus('Preparing the page…');
  try {
    const cv = await renderOutput(S, 200, S.paper), im = $('#printimg');
    $('#pagesize').textContent = `@page{size:${S.paper === 'a4' ? 'A4' : 'letter'};margin:0}`;
    await new Promise(r => { im.onload = r; im.onerror = r; im.src = cv.toDataURL('image/png'); });
    setStatus(''); window.print();
  } catch(e){ setStatus('Printing failed. Download the PDF and print that instead.', 'err'); }
}
function directDownload(data, filename){
  const url = URL.createObjectURL(data), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function doSave(kind){
  if (!downloads && !standalone) return;
  const slug = (catName() === 'your cat' ? 'cat' : catName()).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'cat';
  setStatus('Preparing your file…');
  try {
    const cv = await renderOutput(S, 300, S.paper), what = S.format === 'cards' ? 'pocket-cards' : 'petting-guide'; let data, filename;
    if (kind === 'pdf'){ const pp = PAPER[S.paper] || PAPER.letter; data = await makePdf(cv, pp.pt[0], pp.pt[1]); filename = `${slug}-${what}.pdf`; }
    else { data = await new Promise(r => cv.toBlob(r, 'image/png')); filename = `${slug}-${what}.png`; }
    if (standalone){ directDownload(data, filename); setStatus(kind === 'pdf' ? 'Downloaded. Open the PDF to print it.' : 'Downloaded.', 'ok'); return; }
    setStatus('Confirm the save in the prompt.');
    await downloads.save({ filename, data });
    setStatus(kind === 'pdf' ? 'Saved. Open the PDF to print it.' : 'Saved.', 'ok');
  } catch(e){
    const c = e && e.code;
    if (c === 'declined') setStatus('Save cancelled.');
    else if (c === 'rate_limited') setStatus('A save prompt is already open. Finish that one first.', 'err');
    else if (c === 'too_large') setStatus('That file is too large to save here. Try the image instead.', 'err');
    else { setStatus("This view can't save files. Press and hold the preview to save the image instead.", 'err'); }
  }
}

/* ---------------- map drawing ---------------- */
let mapGeom = null, mapRAF = 0;
function drawMap(){ cancelAnimationFrame(mapRAF); mapRAF = requestAnimationFrame(drawMapNow); }
function syncCat(){ CAT = getCat(S && S.breed); }
function drawMapNow(){
  if (view !== 'zones' || !S) return;
  syncCat();
  const cv = $('#map'), wrap = $('#mapwrap'); if (!cv || !wrap) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1), aspect = MAPB.h / MAPB.w;
  let w = wrap.clientWidth; const narrow = window.innerWidth <= 860; const maxH = narrow ? Math.max(160, window.innerHeight*0.28) : window.innerHeight*0.5;
  if (w*aspect > maxH) w = maxH/aspect;
  const h = w*aspect;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  if (cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const ctx = cv.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, cv.width, cv.height);
  const theme = { outline:cssVar('--ink'), base:cssVar('--cat-base'), hatch:cssVar('--cat-hatch'), seam:'rgba(18,22,34,.35)', face:cssVar('--cat-face'), dim:cssVar('--dim'), ring:cssVar('--ink') };
  const levels = {}; for (const k in S.zones) if (S.zones[k].level) levels[k] = S.zones[k].level;
  const active = CAT.byId[ZONE_ORDER[zi]].i, hov = hoverZone;
  renderCatMap(ctx, 0, 0, cv.width, { levels, theme, active, hover:hov, dpr, heatRes:0.7, coat:S.coat });
  mapGeom = { w, h };
  const zid = ZONE_ORDER[zi], l = levels[zid] && LV[levels[zid]];
  cv.setAttribute('aria-label', `Body map of ${catName()}. Selected: ${CAT.byId[zid].name}${l ? ', ' + l.label : ', not set'}.`);
}
function mapPoint(e){ const cv = $('#map'), r = cv.getBoundingClientRect(); return [MAPB.x0 + (e.clientX - r.left)/r.width*MAPB.w, MAPB.y0 + (e.clientY - r.top)/r.height*MAPB.h]; }

/* ---------------- cat looks (bonus) ---------------- */
const thumbCache = new Map();
function lookThumb(breed, coat){
  const base = '#E6DED3', theme = { outline:cssVar('--ink'), base, hatch:base, seam:'rgba(0,0,0,0)', face:'#1B2030', dim:cssVar('--dim') };
  const key = breed + '|' + coat + '|' + theme.outline;
  if (thumbCache.has(key)) return thumbCache.get(key);
  const dpr = Math.min(2, window.devicePixelRatio || 1), w = Math.round(64*dpr), c = mk(w, Math.round(w*MAPB.h/MAPB.w));
  renderCatMap(c.getContext('2d'), 0, 0, w, { levels:{}, theme, cat:getCat(breed), coat, heatRes:0.25, dpr });
  const url = c.toDataURL('image/png'); if (thumbCache.size > 120) thumbCache.clear(); thumbCache.set(key, url); return url;
}
function renderLookbar(){
  const el = $('#lookbar'); if (!el || !S) return;
  const br = S.breed || 'classic', co = S.coat || 'solid', th = Math.round(64*MAPB.h/MAPB.w);
  const keep = [...el.querySelectorAll('.strip')].map(x => x.scrollLeft);
  const btn = (act, id, name, img, on) => `<button class="look" data-act="${act}" data-v="${id}" data-fk="${act}-${id}" aria-pressed="${on}"><img src="${img}" alt="" width="64" height="${th}"><span>${name}</span></button>`;
  el.innerHTML = `<div class="lookrow"><span class="lab" id="lab-breed">Breed</span><div class="strip" role="group" aria-labelledby="lab-breed">${BREEDS.map(b => btn('breed', b.id, b.name, lookThumb(b.id, co), br === b.id)).join('')}</div></div>
    <div class="lookrow"><span class="lab" id="lab-coat">Coat</span><div class="strip" role="group" aria-labelledby="lab-coat">${COATS.map(c => btn('coat', c.id, c.name, lookThumb(br, c.id), co === c.id)).join('')}</div></div>`;
  el.querySelectorAll('.strip').forEach((st, i) => { if (keep[i] != null) st.scrollLeft = keep[i]; const on = st.querySelector('[aria-pressed="true"]'); if (on && (on.offsetLeft < st.scrollLeft || on.offsetLeft + on.offsetWidth > st.scrollLeft + st.clientWidth - 20)) st.scrollLeft = on.offsetLeft - 8; });
}

/* ---------------- navigation ---------------- */
function go(v){
  if (v !== 'home') ensureState();
  syncCat();
  view = v; confirmNew = false;
  document.querySelectorAll('.view').forEach(el => el.hidden = el.id !== 'v-' + v);
  if (v === 'home') renderHome();
  if (v === 'about') renderAbout();
  if (v === 'zones'){ renderZonesHead(); renderZoneCtl(); drawMap(); }
  if (v === 'mood') renderMood();
  if (v === 'notes') renderNotes();
  if (v === 'print') renderPrint();
  renderStepper();
  const bb = $('#bottombar'); bb.hidden = v === 'home';
  const idx = STEPS.findIndex(s => s[0] === v);
  document.querySelector('.topbar').classList.toggle('steps', v !== 'home');
  updateBottomBar();
  try { history.replaceState(null, '', '#' + v); } catch(e){}
  window.scrollTo(0, 0);
}
function updateBottomBar(){
  const idx = STEPS.findIndex(s => s[0] === view); if (idx < 0) return;
  const back = $('#bb-back'), next = $('#bb-next');
  back.textContent = idx === 0 ? '← Home' : '← ' + STEPS[idx-1][1];
  const nx = STEPS[idx+1];
  if (nx){ next.textContent = 'Next: ' + nx[1] + ' →'; next.dataset.act = 'next'; next.disabled = false; }
  else if (standalone){ next.textContent = 'Print'; next.dataset.act = 'print'; next.disabled = false; }
  else if (downloads){ next.textContent = 'Save PDF'; next.dataset.act = 'savepdf'; next.disabled = false; }
  else { next.textContent = 'Back to start'; next.dataset.act = 'home'; next.disabled = false; }
}
function stepNav(dir){ const idx = STEPS.findIndex(s => s[0] === view); const t = idx + dir; if (t < 0 || t >= STEPS.length) go('home'); else go(STEPS[t][0]); }
function rerenderCurrent(){ rerender(() => { if (view === 'about') renderAbout(); else if (view === 'zones'){ renderZoneCtl(); drawMap(); } else if (view === 'mood') renderMood(); else if (view === 'notes') renderNotes(); else if (view === 'print') renderPrint(); }); }

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, g = b.dataset.g;
  switch (act){
    case 'home': go('home'); break;
    case 'go': go(v); break;
    case 'back': stepNav(-1); break;
    case 'next': stepNav(1); break;
    case 'continue': go('about'); break;
    case 'new': if (S && (S.name || Object.keys(S.zones).length)){ confirmNew = true; renderHome(); } else { S = blank(); save(); go('about'); } break;
    case 'newconfirm': S = blank(); zi = 0; save(); go('about'); break;
    case 'newcancel': confirmNew = false; renderHome(); break;
    case 'loadexample': S = example(); zi = 0; save(); go('about'); break;
    case 'seg':
      if (g === 'pronoun') S.pronoun = v; else if (g === 'hello') S.hello = S.hello === v ? '' : v; else if (g === 'pressure') S.pressure = S.pressure === v ? '' : v;
      else if (g === 'session') S.session = S.session === v ? '' : v; else if (g === 'paper'){ S.paper = v; } else if (g === 'format'){ S.format = v; }
      setDirty(); rerenderCurrent(); break;
    case 'chip': { const arr = S[g]; const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); setDirty(); rerenderCurrent(); break; }
    case 'rmcustom': S[g + 'Custom'].splice(+b.dataset.i, 1); setDirty(); rerenderCurrent(); break;
    case 'add': addCustom(g); break;
    case 'rmphoto': S.photo = null; setDirty(); rerenderCurrent(); break;
    case 'zone': zi = +b.dataset.i; moreTips = false; rerenderCurrent(); break;
    case 'moretips': { const before = document.querySelectorAll('#zonectl .chips .chip:not(.custom)').length; moreTips = true; rerenderCurrent(); const f = document.querySelectorAll('#zonectl .chips .chip:not(.custom)')[before - 1]; if (f) f.focus({ preventScroll:true }); break; }
    case 'zprev': if (zi > 0){ zi--; moreTips = false; rerenderCurrent(); scrollCtl(); } break;
    case 'znext': if (zi < ZONE_ORDER.length - 1){ zi++; moreTips = false; rerenderCurrent(); scrollCtl(); } break;
    case 'skipzone': if (zi < ZONE_ORDER.length - 1){ zi++; moreTips = false; rerenderCurrent(); scrollCtl(); } else go('mood'); break;
    case 'level': { const id = ZONE_ORDER[zi]; if (!v){ delete S.zones[id]; } else { const zs = S.zones[id] || { tips:[] }; zs.level = v; S.zones[id] = zs; } setDirty(); rerenderCurrent(); break; }
    case 'tip': { const zs = S.zones[ZONE_ORDER[zi]]; if (!zs) break; const i = zs.tips.findIndex(t => t.k === v); if (i >= 0) zs.tips.splice(i, 1); else zs.tips.push({ k:v }); setDirty(); rerenderCurrent(); break; }
    case 'rmtip': { const zs = S.zones[ZONE_ORDER[zi]]; if (!zs) break; const i = zs.tips.findIndex(t => t.t === b.dataset.t); if (i >= 0) zs.tips.splice(i, 1); setDirty(); rerenderCurrent(); break; }
    case 'addtip': addTip(); break;
    case 'typical': { let n = 0; ZONE_ORDER.forEach(id => { if (!S.zones[id] || !S.zones[id].level){ S.zones[id] = { level:ZONE_META[id].typical, tips:(S.zones[id] && S.zones[id].tips) || [] }; n++; } }); setDirty(); rerenderCurrent(); toast(`Filled ${n} part${n === 1 ? '' : 's'} with typical ratings. Adjust any that don't fit.`); break; }
    case 'clearzones': S.zones = {}; setDirty(); rerenderCurrent(); toast('All zones cleared.'); break;
    case 'savepdf': doSave('pdf'); break;
    case 'savepng': doSave('png'); break;
    case 'print': doPrint(); break;
    case 'breed': case 'coat':
      if (act === 'breed'){ S.breed = v; if (BREED[v].coat) S.coat = BREED[v].coat; } else S.coat = v;
      syncCat(); setDirty(); rerender(renderLookbar); if (view === 'print') updatePreview(); break;
  }
});
function scrollCtl(){ if (window.innerWidth <= 860){ const c = $('.zcard'); if (c){ const top = c.getBoundingClientRect().top; const mapH = ($('.map-col') || {}).offsetHeight || 0; if (top < mapH + 70) window.scrollBy({ top: top - mapH - 80, behavior:'smooth' }); } } }
function addCustom(g){ const inp = $('#add-' + g); if (!inp) return; const t = inp.value.trim(); if (!t) { inp.focus(); return; } S[g + 'Custom'].push(t); inp.value = ''; setDirty(); rerenderCurrent(); const again = $('#add-' + g); if (again) again.focus(); }
function addTip(){ const inp = $('#ztip'); if (!inp) return; const t = inp.value.trim(); if (!t){ inp.focus(); return; } const zs = S.zones[ZONE_ORDER[zi]]; if (!zs) return; if (!zs.tips.some(x => x.t === t)) zs.tips.push({ t }); setDirty(); rerenderCurrent(); const again = $('#ztip'); if (again) again.focus(); }
document.addEventListener('keydown', e => {
  const el = e.target; if (e.key === 'Enter' && el.dataset && el.dataset.enter){ e.preventDefault(); if (el.dataset.enter === 'add') addCustom(el.dataset.g); else if (el.dataset.enter === 'addtip') addTip(); }
});
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset && el.dataset.bind; if (!k || !S) return;
  S[k] = el.value; if (k === 'name') S.isExample = false; setDirty();
  if (k === 'name' || k === 'pronoun'){ renderStepper(); }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'f-photo') return; const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
      const side = Math.min(im.width, im.height), sz = Math.min(640, side), c = mk(sz, sz), g = c.getContext('2d');
      g.drawImage(im, (im.width - side)/2, (im.height - side)/2, side, side, 0, 0, sz, sz);
      S.photo = c.toDataURL('image/jpeg', 0.86); setDirty(); rerenderCurrent(); };
    im.onerror = () => toast("That file couldn't be read as an image. Try a JPG or PNG.");
    im.src = rd.result; };
  rd.readAsDataURL(f);
});
const mapEl = $('#map');
mapEl.addEventListener('click', e => { const [x, y] = mapPoint(e); const i = hitZone(x, y); if (i == null) return; const idx = ZONE_ORDER.indexOf(CAT.zones[i].id); if (idx >= 0 && idx !== zi){ zi = idx; moreTips = false; rerenderCurrent(); } });
mapEl.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse') return; const [x, y] = mapPoint(e); const i = hitZone(x, y); mapEl.style.cursor = i == null ? 'default' : 'pointer'; mapEl.title = i == null ? '' : CAT.zones[i].name; if (i !== hoverZone){ hoverZone = i; drawMap(); } });
mapEl.addEventListener('pointerleave', () => { if (hoverZone != null){ hoverZone = null; drawMap(); } });
new ResizeObserver(() => drawMap()).observe($('#mapwrap'));
window.addEventListener('resize', drawMap);
new MutationObserver(() => { drawMap(); }).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawMap); } catch(e){}
fontsReady.then(() => { if (view === 'home') renderHome(); });

/* ---------------- boot ---------------- */
(function boot(){
  S = load();
  const h = (location.hash || '').slice(1);
  if (S && STEPS.some(s => s[0] === h)) go(h); else go('home');
})();
</script>
